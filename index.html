<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuaca & Hari Cuti</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: 'Roboto Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #000000;
    }

    .container {
      max-width: 600px;
      width: 100%;
      padding: 2rem;
      box-sizing: border-box;
    }

    .text {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      text-align: justify;
      text-justify: inter-word;
      line-height: 1.8;
    }

    .timestamp {
      margin-top: 1.5rem;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      font-style: italic;
      text-align: right;
    }

    @media (max-width: 480px) {
      .timestamp {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="text">
      Hari ini cuaca panas, pokok terung sudah berbuah, esok cuti.
    </div>
    <div class="timestamp">
      2:24 PM, 30 April 2025
    </div>
  </div>

</body>
</html>
